# Prüfung bei jedem Push und Pull Request (Vertrag §9).
# Hinweis: CapRover baut die Live-App per Webhook direkt bei jedem Push auf main – diese Prüfung blockiert das nicht.
# Deshalb auf Feature-Branches arbeiten und erst nach grüner Prüfung (und Freigabe) nach main übernehmen.
name: Prüfung

on:
  push:
  pull_request:

jobs:
  pruefung:
    name: Tests, Vertragsprüfung, Kontraste, Docker-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Datenbanken reproduzierbar (basis.sql + Varianten)
        run: npm run db:pruefen
      - name: Inhalte (Akten, Warm-up, Probefall – jede SQL-Lösung auf allen Varianten, EH-konform)
        run: npm run validate
      - name: Python für die Material-Werkzeuge (ohne LibreOffice)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx==1.2.0 python-pptx==1.0.2 pypdf==6.17.0 Pillow==12.3.0
      - name: Material-Werkzeuge (Python-Tests; Rendern wird ohne LibreOffice übersprungen)
        run: npm run material:tests
      - name: Material-PDFs vollständig und aktuell (Hash der Quelle), Whitelists passend
        run: npm run material:vollstaendig
      - name: SQL in Materialien (Syntax, EH §8, Ergebnistabellen)
        run: npm run material:sql
      - name: Begriffe, Klarnamen, PDF-Namen, Schülerfassungen ohne Lösungen
        run: npm run material:pruefen
      - name: Kompetenzabdeckung (streng; begründete Ausnahmen im Werkzeug)
        run: npm run material:kompetenzen
      - name: Chromium für die E2E-Tests
        run: npx playwright-core install --with-deps chromium
      - name: E2E (Konsole, Worker, Sichtprüfung)
        run: npm run e2e
      - name: App starten (Entwicklungskonfiguration mit Testschlüssel aus test/fixtures)
        run: |
          npm run dev > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/healthz && exit 0
            sleep 1
          done
          cat app.log
          exit 1
      - name: Vertragsprüfung (scripts/vertrag_pruefen.js)
        run: node scripts/vertrag_pruefen.js http://localhost:3000
      - name: Kontrastprüfung (WCAG AA)
        run: node scripts/kontrast_pruefen.js
      - name: Docker-Image baut
        run: docker build -t datendetektei .
      - name: Docker-Container startet und antwortet
        run: |
          docker run -d --name dd -p 8080:80 \
            -e PLATTFORM_URL=http://localhost:8080 \
            -e PORTAL_URL=http://localhost:3100 \
            -e PORTAL_PUBLIC_KEY="$(cat test/fixtures/dev_portal_public.pem)" \
            -e AUTH_MODUS=portal \
            -e SESSION_SECRET=ci-nur-zum-testen-0123456789abcdef \
            -e ERLAUBE_HTTP=1 \
            datendetektei
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && break
            sleep 1
          done
          node scripts/vertrag_pruefen.js http://localhost:8080 || { docker logs dd; exit 1; }
