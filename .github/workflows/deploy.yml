# Deploy nach CapRover – ausschließlich nach grüner „Prüfung“ auf main (kein CapRover-Webhook).
# Secrets: CAPROVER_URL (z. B. https://captain.example), CAPROVER_APP_TOKEN (App-Token der App „datendetektei“).
name: Deploy

on:
  workflow_run:
    workflows: [Prüfung]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: CapRover-Deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quellstand als Archiv (genau der geprüfte Commit)
        run: git archive --format=tar --output=deploy.tar HEAD
      - name: An CapRover übergeben
        run: npx --yes caprover@2.4.4 deploy --caproverUrl "$CAPROVER_URL" --appToken "$CAPROVER_APP_TOKEN" --appName datendetektei --tarFile deploy.tar
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
